name: drupal-varnish
type: service
from: varnish
guidance: GUIDANCE.md
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.15"
title: Varnish (Drupal)


labels:
- drupal
- varnish

configs:
- name: drupal
  title: Drupal preset
  filepath: /etc/gotpl/presets/drupal.vcl.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/drupal.vcl.tmpl

env:
- name: VARNISH_CONFIG_PRESET
  value: drupal
# Big headers in Drupal Cache-tags.
- name: VARNISHD_PARAM_HTTP_RESP_HDR_LEN
  value: 16k
